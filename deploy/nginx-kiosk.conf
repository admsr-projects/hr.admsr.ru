# Информационный киоск kiosk-hr.admsr.ru (экран 1080×1920).
# Добавить рядом с server { } для hr.admsr.ru. Фронт киоска — отдельная сборка (deploy_kiosk_static.zip),
# бэкенд тот же: gunicorn на 127.0.0.1:8000 (в Django kiosk-hr.admsr.ru уже в ALLOWED_HOSTS).
#
# Каталог для файлов фронта:  /var/www/portal/kiosk-dist  (распаковать туда deploy_kiosk_static.zip)

# В существующем блоке на 80 порту добавьте имя киоска:
#   server_name hr.admsr.ru kiosk-hr.admsr.ru 172.17.30.36;
# либо оставьте этот отдельный блок:
server {
    listen 80;
    listen [::]:80;
    server_name kiosk-hr.admsr.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiosk-hr.admsr.ru;

    # Wildcard *.admsr.ru покрывает только один уровень: kiosk-hr.admsr.ru подходит, kiosk.hr.admsr.ru — нет
    ssl_certificate     /etc/ssl/admsr_05.01.27/admsr.crt;
    ssl_certificate_key /etc/ssl/admsr_05.01.27/admsr.key;

    # Форм на киоске нет, загрузок нет
    client_max_body_size 1M;
    root /var/www/portal/kiosk-dist;
    index 200.html;

    # Заголовки безопасности (как у hr.admsr.ru)
    include /etc/nginx/snippets/nginx-security-headers.conf;

    # Только чтение данных; админка с киоска недоступна
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /admin/ {
        return 404;
    }

    # Сборка с хешами в имени файла: можно кешировать надолго, а 200.html — нет (чтобы киоск видел обновления)
    # add_header внутри location отменяет заголовки уровня server, поэтому snippet подключаем в каждом таком location
    location /_nuxt/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/nginx-security-headers.conf;
        try_files $uri =404;
    }

    location = /200.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/nginx-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /200.html;
    }
}
