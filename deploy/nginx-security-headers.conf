# Заголовки безопасности для hr.admsr.ru.
# Подключить внутри server { } для HTTPS (listen 443 ssl): include /path/to/nginx-security-headers.conf;
#
# Сервер для http (listen 80) должен только перенаправлять на https:
#   server { listen 80; server_name hr.admsr.ru; return 301 https://$host$request_uri; }
#
# Для Django (gunicorn) за nginx добавьте при проксировании:
#   proxy_set_header X-Forwarded-Proto $scheme;
# и задайте в окружении сервера DJANGO_HTTPS_ONLY=True, DJANGO_SECRET_KEY=<длинный случайный ключ>.

add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Политика контента. Сначала включите режим Content-Security-Policy-Report-Only, проверьте консоль браузера
# на нарушения, затем замените на Content-Security-Policy.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://hr.admsr.ru; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
